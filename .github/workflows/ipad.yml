name: iPad host
on:
  workflow_dispatch:
  push:
    branches: [ipad-port]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check source-only payload
        run: python3 ports/rhythm-ipad/audit_source.py
      - name: Test guest RELRO on larger host pages
        run: |
          cc -std=c11 -Wall -Wextra -Werror ports/rhythm-ipad/tests/t_relro_pages.c -o "$RUNNER_TEMP/t_relro_pages"
          "$RUNNER_TEMP/t_relro_pages"
      - name: Test iPad pacing clock domain
        run: |
          cc -std=c11 -Wall -Wextra -Werror ports/rhythm-ipad/tests/t_clock.c -o "$RUNNER_TEMP/t_clock"
          "$RUNNER_TEMP/t_clock"
      - name: Test iPad save snapshots on Darwin
        run: |
          cc -std=c11 -Wall -Wextra -Werror -include ports/rhythm-ipad/dm/ipad/compat.h ports/rhythm-ipad/tests/t_save_snapshot.c ports/rhythm-ipad/dm/android/services_fs.c -o "$RUNNER_TEMP/t_save_snapshot"
          "$RUNNER_TEMP/t_save_snapshot"
      - name: Test growable graphics pool registry
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined ports/rhythm-ipad/tests/t_pool_table.c -o "$RUNNER_TEMP/t_pool_table"
          "$RUNNER_TEMP/t_pool_table"
      - name: Test exact texture snapshot reuse
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-function -fsanitize=address,undefined ports/rhythm-ipad/tests/t_texture_snapshot.c ports/rhythm-ipad/dm/gfx/tex/nvn_bcdec.c -o "$RUNNER_TEMP/t_texture_snapshot"
          "$RUNNER_TEMP/t_texture_snapshot"
      - name: Compile source-only iPad shell
        run: python3 ports/rhythm-ipad/dm/ipad/build.py
      - name: Save build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-host
          path: |
            ports/rhythm-ipad/build/RhythmHost-shell.zip
            ports/rhythm-ipad/build/build-report.json
            ports/rhythm-ipad/build/*.log
          retention-days: 3
