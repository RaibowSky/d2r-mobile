name: iPad host
on:
  workflow_dispatch:
  push:
    branches: [ipad-port]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check source-only payload
        run: python3 ports/rhythm-ipad/audit_source.py
      - name: Test guest RELRO on larger host pages
        run: |
          cc -std=c11 -Wall -Wextra -Werror ports/rhythm-ipad/tests/t_relro_pages.c -o "$RUNNER_TEMP/t_relro_pages"
          "$RUNNER_TEMP/t_relro_pages"
      - name: Test iPad pacing clock domain
        run: |
          cc -std=c11 -Wall -Wextra -Werror ports/rhythm-ipad/tests/t_clock.c -o "$RUNNER_TEMP/t_clock"
          "$RUNNER_TEMP/t_clock"
      - name: Compile source-only iPad shell
        run: python3 ports/rhythm-ipad/dm/ipad/build.py
      - name: Save build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-host
          path: |
            ports/rhythm-ipad/build/RhythmHost-shell.zip
            ports/rhythm-ipad/build/build-report.json
            ports/rhythm-ipad/build/*.log
          retention-days: 3
