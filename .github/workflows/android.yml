name: Android source port
on:
  push:
    branches: [android-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ports/rhythm-android
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/audit_source.py
      - run: python3 dm/android/tests/run_merge_checks.py --output build/tests/merge
      - run: python3 dm/android/tests/run_translation_checks.py --output build/tests/translation
      - run: python3 dm/android/tests/run_attachment_checks.py --output build/tests/attachment
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ports/rhythm-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK and NDK
        run: sdkmanager 'ndk;27.2.12479018' 'platforms;android-34' 'build-tools;35.0.0'
      - name: Build ARM64 native host without ROM samples
        run: |
          cmake -S dm/android -B build/native -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --target d2r_mobile_android -j 4
      - name: Compile Java and verify unsigned shell packaging
        run: python3 tools/package_unsigned.py --sdk "$ANDROID_SDK_ROOT" --jdk "$JAVA_HOME" --native build/native/libd2r_mobile_android.so --output out/shell
      - name: Input-state regression
        run: |
          mkdir -p build/java-tests
          javac -d build/java-tests dm/android/src/org/d2r/binaryprobe/RhythmInputState.java dm/android/tests/RhythmInputStateTest.java
          java -cp build/java-tests org.d2r.binaryprobe.RhythmInputStateTest
