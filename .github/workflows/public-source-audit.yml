name: Public source audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked content and reachable history
        run: python3 tools/audit_public_source.py --history
      - name: Verify publication safeguards
        run: python3 tools/test_public_source_audit.py
